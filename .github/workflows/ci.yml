name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate JSON, YAML and skill metadata
        run: python scripts/validate_repo.py
      - name: Test installer
        run: npm test
      - name: Smoke test MCP handshake
        run: python tests/mock_mcp_smoke.py
      - name: Check package contents
        run: npm pack --dry-run
      - name: Lint Markdown
        run: npm exec --yes --package=markdownlint-cli2@0.24.0 -- markdownlint-cli2
